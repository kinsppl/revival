# PART I — GENERAL AGREEMENT
## ARTICLE 1 — PARTIES AND DEFINITIONS
### 1.1 Parties
This Agreement is proposed between:
CG Chen Proposed Role: Co-Founder and Chief Executive Officer (CEO).
Jaywhy Kim Role: Angel Designer.
Other Founders and Contributors: To be determined.
Venture Name: Revival in TO (working name).
Legal Entity: To be determined.
### 1.2 Definitions
- Venture: Revival in TO and its associated activities, initiatives, programs, products, services, and operations.
- Company or Organization: The legal entity established to operate the Venture.
- Founder: An individual formally recognized as a founder of the Venture.
- Angel Designer: An individual contributing design expertise, strategic guidance, design-thinking capabilities, collaborative problem-solving, and hands-on design support.
- Contribution: Any expertise, work, resources, relationships, introductions, funding assistance, or other support provided to the Venture or another party.
- Mutual Support: The collaborative exchange of value, expertise, opportunities, resources, and assistance between the parties.
- Effective Date: The date this Agreement takes effect, as agreed by the parties.
The Angel Designer role is independent of whether the individual is also formally recognized as a Co-Founder. Any additional designation may be agreed upon separately.
## ARTICLE 2 — PURPOSE AND VISION
### 2.1 Purpose
Revival in TO is currently envisioned as a community-focused initiative.
Its specific mission, objectives, activities, and operating model will be established by the parties.
Mission and Purpose:
[To be completed.]
### 2.2 Vision
The parties intend to bring together complementary skills, experience, expertise, resources, networks, and opportunities to develop and grow Revival in TO.
The relationship is intended to encourage collaboration, creativity, mutual support, and value creation.
### 2.3 Activities
Potential activities may include:
- Community development and engagement.
- Community programs and initiatives.
- Development of products, services, or experiences.
- Partnerships and collaborations.
- Fundraising and grant applications.
- Sponsorships and other funding initiatives.
- Other activities that advance the Venture’s mission.
## ARTICLE 3 — ROLES AND CONTRIBUTIONS
### 3.1 CG Chen — Co-Founder and CEO
CG Chen leads Revival in TO and oversees its overall direction and activities.
Her responsibilities may include:
- Defining and advancing the Venture’s mission and strategy.
- Leading organizational development and operations.
- Managing relationships with stakeholders, partners, and collaborators.
- Overseeing fundraising, grants, sponsorships, and financial planning.
- Coordinating the founding team and contributors.
- Making operational decisions within her agreed authority.
- Representing the Venture externally.
- Identifying opportunities and guiding the Venture’s development.
The specific responsibilities and authority of the CEO will be established as the Venture develops.
### 3.2 Jaywhy Kim — Angel Designer
The Angel Designer contributes design expertise, strategic guidance, design-thinking capabilities, collaborative problem-solving, and hands-on design support.
The arrangement is conceptually comparable to an angel investor relationship, except that the primary contribution is design expertise and services rather than cash.
An angel investor may contribute capital, strategic perspective, experience, connections, and support to an early-stage venture.
The Angel Designer contributes through the equivalent provision of design resources, strategic design expertise, experience, and hands-on collaboration.
Contributions may include:
Design and Strategic Support
- Strategic design guidance and problem-solving.
- Applying design-thinking methodologies to explore and solve challenges.
- Collaborative development and evaluation of ideas and opportunities.
- Hands-on design work and execution where appropriate.
- Creative direction, feedback, and alternative perspectives.
- Challenging assumptions and identifying new approaches.
- Helping shape the Venture’s direction through design expertise and experience.
Networks and Relationships
- Making introductions to relevant people and organizations.
- Sharing professional and industry connections.
- Connecting the Venture with potential partners, collaborators, and supporters.
- Helping expand professional networks.
- Identifying opportunities through existing relationships.
Funding and Business Development
- Helping identify potential grants and funding opportunities.
- Making introductions to potential funders, sponsors, and investors where appropriate.
- Supporting fundraising strategies and initiatives.
- Sharing business development opportunities.
- Helping develop partnerships and collaborations.
- Providing strategic input on funding proposals, presentations, and initiatives.
Knowledge and Resources
- Sharing relevant expertise and experience.
- Providing access to useful tools, resources, and information where appropriate.
- Sharing learning, insights, and opportunities.
- Helping address challenges.
- Collaborating on new ideas and initiatives.
Other Contributions
The Angel Designer may contribute in other ways where mutually beneficial opportunities or needs arise.
The contribution is not restricted to a predetermined product, service, or set of design deliverables.
### 3.3 Other Founders and Contributors
The number and identity of the initial founders will be determined by CG Chen.
Additional founders, advisors, employees, contractors, partners, and other contributors may be engaged as the Venture develops.
Their roles, responsibilities, and participation arrangements will be established separately.
## ARTICLE 4 — MUTUAL SUPPORT AND RECIPROCITY
### 4.1 Guiding Principle
The relationship is based on mutual support and value creation.
The fundamental principle is:
How can I help you, and how can you help me?
The parties intend to contribute their respective skills, expertise, relationships, resources, and opportunities in ways that benefit one another and advance Revival in TO.
### 4.2 Flexible Contributions
Contributions are not limited to a predefined list of responsibilities or deliverables.
The parties may support one another through:
- Professional expertise.
- Strategic advice.
- Design and creative services.
- Networking and introductions.
- Fundraising assistance.
- Business development.
- Knowledge and resource sharing.
- Collaborative projects.
- Access to opportunities.
- Other mutually beneficial contributions.
### 4.3 Recognition and Reciprocity
Contributions may be recognized or reciprocated in different ways, depending on the circumstances and what the parties mutually agree upon.
Potential arrangements include:
- Equity or ownership participation, where legally applicable.
- Salary or other compensation.
- Bartering or exchange of services.
- Reciprocal professional support.
- Access to networks, resources, and opportunities.
- Introductions and relationship-building.
- Collaborative projects or partnerships.
- Other mutually beneficial arrangements.
There is no automatic entitlement to a specific payment, equity percentage, or reciprocal service unless separately agreed upon.
### 4.4 No Fixed Transactional Requirement
The parties do not intend for every contribution to be measured in hours, assigned a monetary value, or converted into a financial obligation.
Some contributions may be informal acts of mutual support, while others may warrant a more formal compensation or exchange arrangement.
Where a specific financial, ownership, or contractual commitment is intended, it should be documented separately.
## ARTICLE 5 — COMPENSATION AND FINANCIAL ARRANGEMENTS
### 5.1 General Principle
Financial and ownership arrangements remain preliminary and flexible until mutually discussed, agreed upon, and appropriately documented.
The parties acknowledge that the appropriate arrangement may differ depending on whether Revival in TO operates as a for-profit corporation or nonprofit organization.
### 5.2 For-Profit Alternative
If the Venture operates as a for-profit corporation, equity may be considered in recognition of the Angel Designer’s contributions and the value brought to the Venture.
Potential arrangements include:
- Equity in exchange for design expertise and services.
- Equity reflecting strategic and hands-on contributions.
- Payment for separately agreed services.
- Bartering or reciprocal service arrangements.
- Other mutually agreed financial or non-financial arrangements.
The equity percentage, valuation, share structure, issuance terms, and associated rights will be discussed and documented separately.
No specific equity percentage or salary is established by this preliminary Agreement.
### 5.3 Nonprofit Alternative
If the Venture operates as a nonprofit organization, salary or service compensation may be considered in recognition of the Angel Designer’s contributions.
Potential arrangements include:
- Salary funded through grants.
- Compensation supported by donations, sponsorships, or other available organizational resources.
- Project-based or service-based compensation.
- Reimbursement of authorized expenses.
- Bartering or other arrangements where lawful and appropriate.
- Other mutually agreed arrangements consistent with nonprofit requirements.
Compensation will depend on available funding, grant conditions, approved budgets, and appropriate organizational approval.
There is no guarantee of salary before funding is available and the compensation arrangement has been properly approved.
### 5.4 Other Financial Contributions
Any personal financial contributions made by a party must be discussed and documented appropriately.
Potential arrangements include:
- Loans.
- Investments, where legally applicable.
- Donations, where appropriate.
- Reimbursable expenses.
- Other mutually agreed arrangements.
No personal financial contribution automatically creates ownership or repayment rights unless documented accordingly.
### 5.5 Expenses
Reasonable expenses incurred on behalf of the Venture may be reimbursed where:
- They relate to Venture activities.
- They are appropriately documented.
- They are approved under the applicable expense policy.
- Funding and legal requirements permit reimbursement.
## ARTICLE 6 — TIME COMMITMENT AND FLEXIBILITY
### 6.1 Flexible Participation
The relationship is intended to remain flexible.
Contributions will depend on:
- The needs of the Venture.
- The responsibilities mutually agreed upon.
- Individual availability and capacity.
- Mutual priorities and opportunities.
### 6.2 No Predetermined Full-Time Commitment
There is no predetermined full-time commitment or fixed weekly number of hours.
Neither party is automatically required to provide unlimited services or dedicate a specific amount of time to the Venture.
### 6.3 Changing Responsibilities
The parties may revisit their responsibilities and working arrangements as the Venture develops.
Specific projects, responsibilities, or deliverables may be agreed upon separately when needed.
## ARTICLE 7 — MANAGEMENT AND DECISION-MAKING
### 7.1 Leadership
CG Chen will lead the Venture as CEO, subject to the authority and limitations established through the applicable legal structure and governance arrangements.
### 7.2 Operational Decisions
Ordinary operational decisions will generally be overseen by the CEO.
The parties may establish financial and operational approval limits.
### 7.3 Strategic Collaboration
The parties intend to collaborate on strategic opportunities, challenges, and decisions where their respective expertise and perspectives can contribute value.
The Angel Designer may participate in strategic discussions, particularly those involving design, innovation, problem-solving, partnerships, and business development.
### 7.4 Important Decisions
The parties will determine which matters require additional approval or consultation.
Potential matters include:
- Changes to the Venture’s mission or purpose.
- Adding or removing founders.
- Major financial commitments.
- External financing or investment.
- Significant compensation arrangements.
- Major partnerships.
- Changes to the legal structure.
- Sale or dissolution of the Venture.
- Significant intellectual property transactions.
Formal voting, shareholder, board, and approval rights will depend on the selected legal structure and applicable agreements.
### 7.5 Disagreements
The parties agree to communicate openly and attempt to resolve disagreements through good-faith discussion.
Where necessary, they may agree to mediation or another dispute resolution process.
## ARTICLE 8 — FUNDING AND FINANCIAL MANAGEMENT
### 8.1 Potential Funding Sources
Depending on the selected legal structure, the Venture may pursue:
- Revenue from products or services.
- Government and private grants.
- Donations.
- Sponsorships.
- Partnerships.
- Investments.
- Loans.
- Other lawful funding sources.
### 8.2 Fundraising Collaboration
The parties may support fundraising through research, introductions, strategic advice, proposal development, presentations, relationship-building, and other mutually agreed activities.
No party guarantees that a funding opportunity, introduction, grant, or investment will result in funding.
### 8.3 Financial Records
The Company or Organization will maintain appropriate financial records, accounts, and documentation.
### 8.4 Financial Transparency
The parties will establish appropriate access to financial information based on their roles, responsibilities, and legal rights.
### 8.5 Use of Funds
All funding must be used in accordance with applicable laws, contractual obligations, grant conditions, and the Venture’s approved purposes.
For a nonprofit, organizational funds and surplus must remain dedicated to its nonprofit purposes.
## ARTICLE 9 — INTELLECTUAL PROPERTY
### 9.1 Venture Intellectual Property
The parties will establish appropriate ownership and usage rights for intellectual property created specifically for the Venture.
### 9.2 Design Contributions
Design work, concepts, prototypes, research, documentation, visual assets, and other materials created for the Venture will be handled according to the applicable written agreements and legal requirements.
### 9.3 Pre-Existing Intellectual Property
Tools, templates, frameworks, methods, processes, and other materials owned or independently developed by a party before contributing to the Venture will remain that party’s property unless otherwise agreed in writing.
Where these materials are used by the Venture, the parties will establish an appropriate licence or permission.
### 9.4 Third-Party Materials
The parties will respect applicable third-party intellectual property rights, including software licences, fonts, images, stock assets, open-source materials, and other licensed content.
### 9.5 Separate Documentation
Any necessary intellectual property assignment, licence, or ownership arrangement may be documented separately.
## ARTICLE 10 — CONFIDENTIALITY
### 10.1 Confidential Information
Confidential information may include:
- Business plans and strategies.
- Financial information.
- Product and service concepts.
- Designs and prototypes.
- Research and development.
- Customer and partner information.
- Grant and fundraising information.
- Internal communications.
- Proprietary processes and materials.
### 10.2 Confidentiality Obligations
Each party agrees to protect confidential information and not disclose or use it outside the purposes of the Venture without appropriate authorization.
### 10.3 Exceptions
Confidentiality obligations do not apply to information that:
- Is publicly available through no breach of this Agreement.
- Was lawfully known before disclosure.
- Is independently developed without using confidential information.
- Must be disclosed by law or a lawful authority.
### 10.4 Duration
Confidentiality obligations will continue after a party’s participation ends, subject to applicable law and the nature of the information.
## ARTICLE 11 — DEPARTURE AND CHANGES IN PARTICIPATION
### 11.1 Voluntary Departure
A party may discontinue their participation by providing reasonable notice and communicating their intention to the other parties.
The parties may establish specific notice periods where appropriate.
### 11.2 Changes in Availability
If a party’s availability or circumstances change, the parties will discuss how responsibilities and contributions may be adjusted.
### 11.3 Inability to Participate
If a party becomes unable to participate due to illness, incapacity, or other circumstances, the parties will discuss an appropriate temporary or permanent arrangement.
### 11.4 Consequences of Departure
Any outstanding compensation, equity, intellectual property, expenses, confidentiality obligations, or other commitments will be handled according to the applicable agreements and legal requirements.
### 11.5 Future Arrangements
The parties may agree to modify or conclude their collaborative relationship as the Venture evolves.
## ARTICLE 12 — EQUITY AND OWNERSHIP
This Article applies only if the Venture operates as a for-profit corporation.
### 12.1 Preliminary Equity Considerations
Equity may be considered as a way of recognizing contributions to the Venture.
No specific equity allocation is established by this Agreement.
### 12.2 Angel Designer Equity
The parties may negotiate an equity interest for the Angel Designer in recognition of design expertise, strategic support, hands-on work, and other agreed contributions.
### 12.3 Equity Documentation
Any equity arrangement must be documented separately, including:
- Percentage ownership.
- Share class.
- Consideration and valuation.
- Issuance and payment terms.
- Voting and shareholder rights.
- Vesting, if applicable.
- Transfer restrictions.
- Dilution and future share issuance.
### 12.4 Future Investors and Participants
Future founders, investors, employees, and other participants may receive equity through appropriate corporate approvals and documentation.
### 12.5 Exit and Transfer
Share transfers, company sales, buybacks, and other ownership changes will be governed by the applicable corporate and shareholder documents.
## ARTICLE 13 — NONPROFIT GOVERNANCE AND COMPENSATION
This Article applies only if the Venture operates as a nonprofit organization.
### 13.1 Organizational Structure
The organization will operate according to its applicable incorporating statute, articles, bylaws, and governance policies.
### 13.2 Governance
The parties will determine:
- Board composition.
- Number of directors.
- Appointment and removal procedures.
- Membership structure, if applicable.
- Voting and approval requirements.
- Officer responsibilities.
- Reporting and governance procedures.
### 13.3 Angel Designer Compensation
The Angel Designer may receive salary or approved service compensation for legitimate services provided to the organization.
The amount, payment frequency, and arrangement will be determined separately, subject to available funding, grant restrictions, approved budgets, and appropriate approval.
### 13.4 Conflict of Interest
Any person with a financial or personal interest in an organizational decision must disclose that interest and follow the applicable conflict-of-interest procedures.
### 13.5 Organizational Assets
Organizational assets and surplus must be used to further the organization’s nonprofit purposes.
No founder, member, director, or officer may receive a distribution of organizational surplus as an ownership return, except as permitted by applicable law.
Reasonable compensation for legitimate services and reimbursement of authorized expenses may be permitted under applicable requirements.
### 13.6 Dissolution
Upon dissolution, remaining assets must be distributed in accordance with the organization’s governing documents and applicable law.
## ARTICLE 14 — RECORDS AND COMMUNICATION
### 14.1 Records
The Venture will maintain appropriate records relating to:
- Financial transactions.
- Contracts and agreements.
- Intellectual property.
- Funding and grants.
- Corporate or organizational decisions.
- Material operational activities.
### 14.2 Communication
The parties agree to maintain open communication regarding:
- Opportunities and challenges.
- Support needed and available.
- Contributions and expectations.
- Changes in responsibilities or availability.
- Financial or compensation arrangements.
- Important decisions.
### 14.3 Written Approvals
Material financial, ownership, or legal commitments should be documented in writing.
## ARTICLE 15 — NOTICES AND DISPUTE RESOLUTION
### 15.1 Notices
Formal notices will be delivered using the agreed email addresses or other contact details.
### 15.2 Good-Faith Resolution
The parties will first attempt to resolve disputes through direct communication and good-faith discussion.
### 15.3 Mediation
If a dispute cannot be resolved, the parties may agree to mediation before pursuing litigation.
### 15.4 Governing Law
This Agreement is intended to be governed by the laws of Ontario and the applicable laws of Canada, subject to the final legal structure and legal review.
## ARTICLE 16 — GENERAL PROVISIONS
### 16.1 Preliminary Nature
This document is a working framework for discussion and does not establish an automatic entitlement to equity, salary, funding, services, or other compensation unless expressly agreed and documented.
### 16.2 Separate Agreements
Specific arrangements may be documented separately where necessary, including:
- Shareholder agreements.
- Equity issuance documents.
- Employment agreements.
- Service agreements.
- Bartering agreements.
- Intellectual property assignments or licences.
- Funding agreements.
- Partnership agreements.
### 16.3 Amendments
Any formal amendment to this Agreement must be documented in writing and approved by the relevant parties.
### 16.4 Entire Agreement
Once finalized and signed, this Agreement and its completed schedules will represent the agreement between the parties concerning its subject matter, subject to any separately executed documents.
### 16.5 Severability
If any provision is found unenforceable, the remaining provisions will continue to apply to the extent legally permitted.
### 16.6 Independent Advice
Each party may obtain independent legal, financial, and tax advice before entering into binding arrangements.
### 16.7 Electronic Signatures
This Agreement may be signed electronically where legally permitted.
